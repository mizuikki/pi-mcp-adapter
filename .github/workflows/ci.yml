name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_FORK_COMMIT: 15702b969be73bf115cdbd4694f1ce89782c62af

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check out local Pi fork
        run: |
          git clone --filter=blob:none --branch local-fork-extension-unification https://github.com/mizuikki/pi.git ../pi
          git -C ../pi checkout --detach "$PI_FORK_COMMIT"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Verify local Pi fork contract
        run: npm run test:pi-fork -- --pi-dir ../pi --pi-ref "$PI_FORK_COMMIT"
